<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cornflakes Media{% endblock %}</title>
<style>
  :root {
    --bg: #f6f3ec;
    --bg-2: #efebe1;
    --panel: #fffdf8;
    --ink: #191410;
    --muted: #837b6c;
    --line: #e3ddd0;
    --line-strong: #d6cebd;
    --accent: #e8472a;
    --accent-ink: #fff;
    --ok: #0e8a5f;
    --warn: #b5740a;
    --bad: #cf2e2e;
    --info: #2b6cb0;
    --radius: 14px;
    --shadow: 0 1px 0 rgba(24,20,16,.04), 0 14px 34px -22px rgba(24,20,16,.35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font: 15px/1.55 var(--font); min-height: 100vh;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background-image: radial-gradient(rgba(24,20,16,.055) 1px, transparent 1.4px);
    background-size: 26px 26px;
  }
  body::before {
    content: ""; position: fixed; left: 0; right: 0; top: 0; height: 460px; z-index: -1;
    background: radial-gradient(70% 100% at 50% 0%, rgba(232,71,42,.10), transparent 70%);
  }

  ::selection { background: var(--accent); color: #fff; }

  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 28px;
    background: rgba(246,243,236,.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
  header .brand a { color: var(--ink); text-decoration: none; }
  header .brand .logo {
    display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px;
    background: var(--ink); color: #fff; font-size: 17px;
    box-shadow: 0 6px 16px -8px rgba(24,20,16,.6);
  }
  header .brand .tier { color: var(--accent); }
  header .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); white-space: nowrap; }

  main { padding: 34px 28px 96px; max-width: 1200px; margin: 0 auto; }

  h1 { font-size: clamp(30px, 5vw, 44px); margin: 0 0 8px; letter-spacing: -0.035em; font-weight: 850; line-height: 1.05; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted);
       margin: 34px 0 12px; display: flex; align-items: center; gap: 10px; font-weight: 750; }
  h2::after { content: ""; height: 1px; flex: 1; background: var(--line); }
  .sub { color: var(--muted); margin-bottom: 22px; font-size: 16px; }
  .muted { color: var(--muted); }
  .nowrap { white-space: nowrap; }
  code { color: var(--ink); font-family: var(--mono); font-size: 13px; background: var(--bg-2); padding: 1px 5px; border-radius: 5px; }
  .accent { color: var(--accent); }
  .mono { font-family: var(--mono); }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .grid { display: grid; gap: 16px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; position: relative; overflow: hidden; box-shadow: var(--shadow);
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease, border-color .22s ease;
    animation: rise .5s ease backwards;
  }
  .stat:hover { transform: translateY(-3px); border-color: var(--line-strong); box-shadow: 0 1px 0 rgba(24,20,16,.05), 0 22px 44px -24px rgba(24,20,16,.4); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 750; }
  .stat .value { font-size: 30px; font-weight: 800; margin-top: 6px; font-family: var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .stat .tick { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); opacity: 0; transition: opacity .25s ease; }
  .stat:hover .tick { opacity: 1; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 750; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .15s ease; }
  tbody tr:hover { background: var(--bg-2); }

  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 700; border: 1px solid var(--line-strong); background: var(--bg);
    color: var(--muted); animation: pop .3s ease backwards; white-space: nowrap;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.done, .chip.clip_ready, .chip.image_ready { color: var(--ok); background: #e9f6ef; border-color: #bfe4d3; }
  .chip.running, .chip.queued, .chip.pending { color: var(--warn); background: #fbf2e0; border-color: #eeddbb; }
  .chip.running::before, .chip.queued::before, .chip.pending::before { animation: pulse 1.2s ease-in-out infinite; }
  .chip.failed, .chip.cancelled, .chip.dead, .chip.error { color: var(--bad); background: #fcebeb; border-color: #f2c6c6; }
  .chip.cache, .chip.hit { color: var(--info); background: #e9f1fa; border-color: #c4d8ee; }
  .chip.degraded { color: var(--accent); background: #fbeae6; border-color: #f0c8be; }
  .chip.mono { font-family: var(--mono); }
  .chip.mono::before { display: none; }

  input, select, textarea, button {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 14px;
    transition: border-color .18s ease, box-shadow .18s ease, transform .12s ease, background .18s ease;
  }
  textarea { width: 100%; min-height: 92px; resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(24,20,16,.07); }
  select { cursor: pointer; }
  button { cursor: pointer; font-weight: 700; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 0 10px 24px -12px rgba(24,20,16,.55); }
  button.primary:hover { background: #000; transform: translateY(-1px); }
  button.primary.accent { background: var(--accent); border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: #f0c9c9; background: #fff; }
  button.danger:hover { background: #fcebeb; }
  button.ghost { color: var(--muted); background: transparent; border-color: transparent; }
  button.ghost:hover { color: var(--ink); background: var(--bg-2); border-color: var(--line); }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; }

  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .right { margin-left: auto; }
  a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--accent); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  #toast { position: fixed; right: 22px; bottom: 22px; z-index: 100; display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
  #toast .t { padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; background: var(--ink); color: #fff; box-shadow: var(--shadow); animation: rise .3s ease; }
  #toast .t.err { background: var(--bad); }
  #toast .t.ok { background: var(--ok); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">🎬</span>
    <a href="/">Cornflakes Media <span class="tier">· Shot Pipeline</span></a>
  </div>
  <div class="meta">demo · mocks only · no paid APIs</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="toast"></div>
<script>
function toast(msg, kind) {
  const box = document.getElementById('toast');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 't ' + (kind || 'err');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; setTimeout(() => el.remove(), 400); }, 4400);
}
function rupee(cents) { return '₹' + (Number(cents || 0) / 100).toFixed(2); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function countUp(el, targetCents) {
  if (!el) return;
  const isRupee = el.dataset.rupee === '1';
  const from = parseFloat(el.dataset.raw || '0');
  const to = Number(targetCents || 0) / (isRupee ? 100 : 1);
  const dur = 550, t0 = performance.now();
  function step(t) {
    const k = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    const v = from + (to - from) * eased;
    el.textContent = isRupee ? '₹' + v.toFixed(2) : Math.round(v).toLocaleString();
    if (k < 1) requestAnimationFrame(step); else el.dataset.raw = String(to * (isRupee ? 100 : 1));
  }
  requestAnimationFrame(step);
}
</script>
</body>
</html>
